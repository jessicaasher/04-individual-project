<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04 Individual Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <section id="landing">
        <nav>
            <div class="navbar">
                <img class="logo" src="./assets/movie-search-logo.svg" alt="Movie Search Logo">
                <ul class="navlinks">
                    <li><a href="#" class="
                        nav__link--anchor
                        link__hover-effect
                        link__hover-effect--black
                        ">Home</a></li>
                    <li><a href="#" class="
                        nav__link--anchor
                        link__hover-effect
                        link__hover-effect--black
                        ">Find a Movie</a></li>
                    <li class="nav__link"><a href="#" class="
                        nav__link--anchor
                        nav__link--anchor-primary
                        ">Contact</a></li>
                </ul>
            </div>
        </nav>
        <header>
            <div class="header__container">
                <section class="gallery">
                    <div class="card">
                        <img src="https://via.placeholder.com/250x150" alt="Card 1">
                        <h2>Movie One</h2>
                        <p>Movie One Description</p>
                    </div>

                    <div class="card">
                        <img src="https://via.placeholder.com/250x150" alt="Card 2">
                        <h2>Movie Two</h2>
                        <p>Movie Two Description</p>
                    </div>

                    <div class="card">
                        <img src="https://via.placeholder.com/250x150" alt="Card 3">
                        <h2>Movie Three</h2>
                        <p>Movie Three Description</p>
                    </div>
                </section>
            </div>
        </header>
    </section>
</body>
</html>
